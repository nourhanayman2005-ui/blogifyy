<!DOCTYPE html>
<html>
<head>
    <title>Blogify</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
    <script src="js/main.js" defer></script>
</head>

<body>

<header>
    <h1>Blogify</h1>

    <a href="index.html">Home</a>

</header>

<main>

    <h2 id="welcome"></h2>
